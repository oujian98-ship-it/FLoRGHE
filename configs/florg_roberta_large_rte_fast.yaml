seed: 42
method: florg

data:
  root: D:/data

runtime:
  reuse_client_model: true

task:
  name: rte
  type: glue

model:
  name_or_path: roberta-large
  task_type: sequence_classification
  target_modules:
    - query
    - value
  num_labels: 2
  train_classifier_head: true
  use_fast_tokenizer: true

adapter:
  rank: 4
  alpha: 16
  dropout: 0.0
  init_scale: 0.01
  basis_init: semi_orthogonal

federated:
  num_clients: 5
  participation_ratio: 1.0
  rounds: 5
  local_epochs: 1
  aggregation: equal
  non_iid:
    type: dirichlet
    alpha: 0.5
    min_size: 1

training:
  lr: 5.0e-5
  weight_decay: 0.0
  batch_size: 32
  max_seq_length: 128
  optimizer: adamw
  max_grad_norm: 1.0

eval:
  every_round: 5
  batch_size: 64
  metric: accuracy

output_dir: outputs/florg_roberta_large_rte_fast
