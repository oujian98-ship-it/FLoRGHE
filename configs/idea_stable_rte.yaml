seed: 42
method: idea_prefix_safe

data:
  root: D:/data

task:
  name: rte
  type: glue

model:
  name_or_path: roberta-large
  task_type: sequence_classification
  target_modules:
    - query
    - value
  num_labels: 2
  train_classifier_head: true
  use_fast_tokenizer: true
  local_files_only: true

adapter:
  type: hetero_lora
  alpha: 16
  dropout: 0.0
  init_scale: 0.01
  server_rank: 4

aggregation:
  space: delta_w
  rank_weight_gamma: 0.0
  procrustes: prefix_safe
  server_tau: 0.4
  head_tau: 0.3
  delta_clip_factor: 2.0
  svd:
    type: exact
    eps: 1.0e-08
    n_oversamples: 8
    n_iter: 1

hetero_rank:
  mode: homogeneous
  rank_candidates:
    - 4
  r_min_semantic: 4
  semantic_layer_patterns: []

federated:
  num_clients: 20
  participation_ratio: 1.0
  rounds: 50
  local_epochs: 1
  non_iid:
    type: dirichlet
    alpha: 1.0
    min_size: 10
    max_size_ratio: 10.0
    min_classes_per_client: 1
    max_tries: 5000

training:
  lr: 5.0e-5
  head_lr: 1.0e-5
  weight_decay: 0.0
  batch_size: 4
  max_seq_length: 128
  optimizer: adamw
  max_grad_norm: 1.0

eval:
  every_round: 1
  batch_size: 64
  metric: accuracy
  debug_predictions: true

output_dir: outputs/idea_stable_rte
